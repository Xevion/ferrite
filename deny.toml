[advisories]
yanked = "warn"
unmaintained = "all"
unsound = "workspace"
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained with no successor release; fontdue needs it to rasterize the dashboard's fonts" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Unpublished workspace crates are not checked, which covers ferrite-wifi-sys
# (GPL-2.0-only, compiled from Linux sources) without allowing GPL globally.
[licenses.private]
ignore = true

[bans]
# Warn on duplicate versions of the same crate across the dependency tree.
multiple-versions = "warn"
# Deny wildcard version requirements in workspace member Cargo.toml files.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
