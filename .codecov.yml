codecov:
  notify:
    wait_for_ci: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
        branches:
          - master
    patch:
      default:
        target: 90%
        threshold: 0%
  ignore:
    - "crates/ferrite-linux/src/main.rs"
    - "crates/ferrite-linux/src/ops/avx512.rs"
    - "crates/ferrite-linux/src/tui/mod.rs"
    - "crates/ferrite-linux/src/tui/run.rs"

component_management:
  individual_components:
    - component_id: patterns
      name: Test Patterns
      paths:
        - crates/ferrite-linux/src/pattern/**
    - component_id: ops
      name: Memory Operations
      paths:
        - crates/ferrite-linux/src/ops/**
    - component_id: alloc
      name: Allocator
      paths:
        - crates/ferrite-linux/src/alloc.rs
    - component_id: runner
      name: Runner
      paths:
        - crates/ferrite-linux/src/runner.rs
    - component_id: analysis
      name: Analysis
      paths:
        - crates/ferrite-linux/src/error_analysis.rs
        - crates/ferrite-linux/src/failure.rs
    - component_id: hardware
      name: Hardware I/O
      paths:
        - crates/ferrite-linux/src/output.rs
        - crates/ferrite-linux/src/phys.rs
        - crates/ferrite-linux/src/edac.rs
        - crates/ferrite-linux/src/smbios.rs
        - crates/ferrite-linux/src/dimm.rs

comment:
  layout: "condensed_header, diff, components, condensed_footer"
  behavior: default
  require_changes: coverage_drop
  hide_project_coverage: false

github_checks:
  annotations: true
