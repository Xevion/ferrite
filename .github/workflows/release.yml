name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release again (e.g. v0.4.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag against the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "ferrite") | .version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG does not match ferrite's version $version"
            exit 1
          fi

      - name: Create the GitHub release
        run: |
          awk -v head="## [${TAG#v}]" 'index($0, "## ") == 1 { if (found) exit; found = index($0, head) == 1; next } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no entry for ${TAG#v}"
            exit 1
          fi
          gh release view "$TAG" || gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Build (${{ matrix.target.arch }})
    needs: release
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: x86_64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - arch: aarch64
            runner: ubuntu-22.04
            rust_target: aarch64-unknown-linux-gnu
            cross: true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target.rust_target }}

      - name: Install cross-compilation tools
        if: matrix.target.cross
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Build
        run: cargo build --release --target ${{ matrix.target.rust_target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.target.cross && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Rename binary
        run: cp "target/${{ matrix.target.rust_target }}/release/ferrite" "ferrite-linux-${{ matrix.target.arch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ferrite-linux-${{ matrix.target.arch }}
          path: ferrite-linux-${{ matrix.target.arch }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload to GitHub release
        run: gh release upload "$TAG" "ferrite-linux-${{ matrix.target.arch }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
