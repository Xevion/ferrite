name: Check

on:
  push:
    branches: [master]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A push groups by commit, so pushes in quick succession each keep their own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cargo fmt --all -- --check
          else
            cargo fmt --all -- --check || echo "::warning::Formatting issues found (not failing on push)"
          fi

      - name: Clippy (all features)
        run: cargo clippy -p ferrite --all-targets --all-features -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy -p ferrite --all-targets --no-default-features -- -D warnings

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: Check for unused dependencies
        run: cargo machete

  test:
    name: Test (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        features: ["--all-features", "--no-default-features"]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.132

      - name: Run tests
        run: cargo nextest run -p ferrite --no-fail-fast --hide-progress-bar --failure-output final ${{ matrix.features }}

  # Every crate that builds without the Linux snapshot.
  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: >-
        --workspace --exclude ferrite --exclude ferrite-uefi --exclude ferrite-recon
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-uefi

      - uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.132

      - name: Clippy (host crates)
        run: cargo clippy --locked $HOST --all-targets -- -D warnings

      - name: Clippy (UEFI apps)
        run: cargo efi-clippy --locked -- -D warnings

      - name: Tests
        run: |
          cargo nextest run --locked $HOST --no-fail-fast --hide-progress-bar --failure-output final
          cargo nextest run --locked -p ferrite-uefi -p ferrite-recon --lib --no-fail-fast --hide-progress-bar --failure-output final
