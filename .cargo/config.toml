[alias]
efi-build = "build --target x86_64-unknown-uefi -p ferrite-uefi -p ferrite-recon -p ferrite-loader"
efi-check = "check --target x86_64-unknown-uefi -p ferrite-uefi -p ferrite-recon -p ferrite-loader"
efi-clippy = "clippy --target x86_64-unknown-uefi -p ferrite-uefi -p ferrite-recon -p ferrite-loader"
# Apps that link the Linux C, which is ELF: built for x86_64-unknown-none, then converted to a .efi
# by `ferrite-dev build`.
efi-elf-build = "build --target x86_64-unknown-none -p ferrite-wifi-efi"
efi-elf-check = "check --target x86_64-unknown-none -p ferrite-wifi-efi"
efi-elf-clippy = "clippy --target x86_64-unknown-none -p ferrite-wifi-efi"

# x86_64-unknown-none is soft float and the task switch saves no vector registers, so the
# RustCrypto primitives keep to their portable code instead of AES-NI and SHA extensions.
[target.x86_64-unknown-none]
rustflags = ["--cfg", "aes_backend=\"soft\"", "--cfg", "sha1_backend=\"soft\""]
