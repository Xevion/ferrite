[package]
name = "ferrite-dev"
description = "Desktop tool: DbC log capture, the benchmark peer and the remote target run cycle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
crc32fast = { workspace = true, features = ["std"] }
ferrite-config.workspace = true
ferrite-wire.workspace = true
humantime.workspace = true
jiff = { workspace = true, features = ["std", "tz-system", "tz-fat", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated", "perf-inline"] }
nusb.workspace = true
object = { workspace = true, features = ["archive"] }
rustix.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
sha2.workspace = true
signal-hook.workspace = true
snafu = { workspace = true, features = ["std"] }
toml = { workspace = true, features = ["std", "parse", "serde", "display"] }

[dev-dependencies]
assert2.workspace = true
parking_lot.workspace = true
rstest.workspace = true

[lints]
workspace = true
