[package]
name = "ferrite-config"
description = "The settings file on the boot volume: its schema, validation and template, shared by the apps and every tool that edits it"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ferrite-net.workspace = true
ferrite-power.workspace = true
ferrite-wpa.workspace = true
jiff = { workspace = true, features = ["alloc", "tzdb-bundle-always"] }
serde = { workspace = true, features = ["alloc"] }
strum.workspace = true
snafu.workspace = true
toml = { workspace = true, features = ["parse", "serde", "display"] }

[dev-dependencies]
assert2.workspace = true
rstest.workspace = true

[lints]
workspace = true
