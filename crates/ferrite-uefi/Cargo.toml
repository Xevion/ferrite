[package]
name = "ferrite-uefi"
description = "Bare-metal memory sweep with a ratatui UI and a status page served over the machine's own NIC"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ratatui.workspace = true
ratatui-core.workspace = true
smoltcp.workspace = true
uefi.workspace = true

# The allocator and panic handler would collide with std's on a host build.
[target.'cfg(target_os = "uefi")'.dependencies]
uefi = { workspace = true, features = ["global_allocator", "panic_handler"] }

[lints]
workspace = true
