[package]
name = "ferrite-uefi"
description = "Bare-metal memory sweep with a framebuffer dashboard (ratatui on text-only consoles) and a status page served over the machine's own NIC"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Built as a static-PIE ELF and converted to a .efi by ferrite-dev, to have SSE and AVX.
[package.metadata.ferrite]
target = "x86_64-unknown-linux-gnu"

[dependencies]
ferrite-config.workspace = true
ferrite-efi = { workspace = true, features = ["config", "crew", "net"] }
ferrite-hal.workspace = true
ferrite-mem.workspace = true
ferrite-net.workspace = true
ferrite-wifi.workspace = true
ferrite-wpa.workspace = true
fontdue.workspace = true
# Fixed-capacity strings for text formatted every frame or request, kept off the heap.
heapless.workspace = true
jiff = { workspace = true, features = ["alloc", "tzdb-bundle-always"] }
log.workspace = true
ratatui.workspace = true
ratatui-core.workspace = true
snafu.workspace = true
tiny-skia.workspace = true
uefi.workspace = true

# The allocator and panic handler would collide with std's on a host build.
[target.'cfg(ferrite_app)'.dependencies]
ferrite-efi = { workspace = true, features = ["panic-handler"] }
ferrite-rt.workspace = true
# The Wi-Fi station; it links the Linux Wi-Fi C, so host builds go without it.
ferrite-wifi-efi.workspace = true
uefi = { workspace = true, features = ["global_allocator"] }

[dev-dependencies]
assert2.workspace = true
ferrite-testing.workspace = true
rstest.workspace = true
smoltcp.workspace = true

[lints]
workspace = true
