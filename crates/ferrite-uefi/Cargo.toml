[package]
name = "ferrite-uefi"
description = "Bare-metal memory sweep with a ratatui UI and a status page served over the machine's own NIC"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Built as a static-PIE ELF and converted to a .efi by ferrite-dev, to have SSE and AVX.
[package.metadata.ferrite]
target = "x86_64-unknown-linux-gnu"

[dependencies]
ferrite-efi.workspace = true
ferrite-hal.workspace = true
log.workspace = true
ratatui.workspace = true
ratatui-core.workspace = true
# Answers ping, as a liveness check.
smoltcp = { workspace = true, features = ["auto-icmp-echo-reply"] }
snafu.workspace = true
uefi.workspace = true

# The allocator and panic handler would collide with std's on a host build.
[target.'cfg(ferrite_app)'.dependencies]
ferrite-efi = { workspace = true, features = ["panic-handler"] }
ferrite-rt.workspace = true
uefi = { workspace = true, features = ["global_allocator"] }

[dev-dependencies]
assert2.workspace = true
rstest.workspace = true

[lints]
workspace = true
