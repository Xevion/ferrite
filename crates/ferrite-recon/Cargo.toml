[package]
name = "ferrite-recon"
description = "Standalone hardware recon apps: PCI scan, xHCI scan, DbC bring-up"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ferrite-efi.workspace = true
ferrite-xhci.workspace = true
uefi.workspace = true

# The allocator and panic handler would collide with std's on a host build.
[target.'cfg(target_os = "uefi")'.dependencies]
uefi = { workspace = true, features = ["global_allocator", "panic_handler"] }

[lints]
workspace = true
