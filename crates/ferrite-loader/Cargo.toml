[package]
name = "ferrite-loader"
description = "Resident DbC loader: receives .efi images over the link, runs them and reports their exit status"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ferrite-efi.workspace = true
ferrite-hal.workspace = true
ferrite-recon.workspace = true
ferrite-wire.workspace = true
ferrite-xhci.workspace = true
log.workspace = true
uefi.workspace = true

# The allocator and panic handler would collide with std's on a host build.
[target.'cfg(target_os = "uefi")'.dependencies]
ferrite-efi = { workspace = true, features = ["panic-handler"] }
uefi = { workspace = true, features = ["global_allocator"] }

[lints]
workspace = true
