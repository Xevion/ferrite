[package]
name = "ferrite-efi"
description = "UEFI runtime support: boot-volume reports, unattended exit, TSC clock"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Loads the settings file from the boot volume; pulls in ferrite-config (and so ferrite-net and ferrite-wpa), so the loader leaves it off.
config = ["dep:ferrite-config"]
# Records panics in the boot log and shuts down; apps enabling this must not enable uefi's own `panic_handler`.
panic-handler = []
# The firmware's Simple Network Protocol as a `ferrite_net::Port`; pulls in smoltcp, so the loader leaves it off.
net = ["dep:ferrite-net"]
# Runs `ferrite_mem::crew` jobs on the firmware's APs; pulls in ferrite-mem, so the loader leaves it off.
crew = ["dep:ferrite-mem"]

[dependencies]
crc32fast.workspace = true
ferrite-config = { workspace = true, optional = true }
ferrite-hal.workspace = true
ferrite-power.workspace = true
ferrite-mem = { workspace = true, optional = true }
ferrite-net = { workspace = true, optional = true }
ferrite-wire.workspace = true
ferrite-xhci.workspace = true
log.workspace = true
snafu.workspace = true
uefi.workspace = true

[dev-dependencies]
assert2.workspace = true
rstest.workspace = true

[lints]
workspace = true
