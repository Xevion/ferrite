[package]
name = "ferrite-wifi-efi"
description = "The Wi-Fi C under UEFI: the shim's platform pieces from firmware services, and the wifitrace app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Built as a static-PIE ELF and converted to a .efi by ferrite-dev, because the C it links is ELF.
[package.metadata.ferrite]
target = "x86_64-unknown-linux-gnu"

[dependencies]
corosensei.workspace = true
ferrite-efi = { workspace = true, features = ["panic-handler"] }
ferrite-hal.workspace = true
ferrite-lkpi.workspace = true
ferrite-rt.workspace = true
ferrite-netif.workspace = true
ferrite-wifi-start.workspace = true
log.workspace = true
smoltcp.workspace = true
snafu.workspace = true
uefi = { workspace = true, features = ["global_allocator"] }

[lints]
workspace = true
