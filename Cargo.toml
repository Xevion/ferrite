[workspace]
resolver = "3"
members = ["crates/*"]
# Host-buildable crates. The UEFI binaries are built through the `efi-*`
# aliases in .cargo/config.toml.
# ferrite-wifi-sys needs its Linux snapshot, which the Justfile recipes make first with `just vendor`.
default-members = ["crates/ferrite-hal", "crates/ferrite-rt", "crates/ferrite-xhci", "crates/ferrite-efi", "crates/ferrite-testing", "crates/ferrite-wire", "crates/ferrite-dev", "crates/ferrite-wifi-sys", "crates/ferrite-nl80211", "crates/ferrite-netif", "crates/ferrite-wpa", "crates/ferrite-lkpi", "crates/ferrite-wifi-start", "crates/ferrite-lab", "crates/ferrite-mem", "crates/ferrite-linux"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
ferrite-efi = { path = "crates/ferrite-efi" }
ferrite-hal = { path = "crates/ferrite-hal" }
ferrite-lkpi = { path = "crates/ferrite-lkpi" }
ferrite-mem = { path = "crates/ferrite-mem" }
ferrite-rt = { path = "crates/ferrite-rt" }
ferrite-netif = { path = "crates/ferrite-netif" }
ferrite-nl80211 = { path = "crates/ferrite-nl80211" }
ferrite-wifi-start = { path = "crates/ferrite-wifi-start" }
ferrite-wifi-sys = { path = "crates/ferrite-wifi-sys" }
ferrite-recon = { path = "crates/ferrite-recon" }
ferrite-testing = { path = "crates/ferrite-testing" }
ferrite-wire = { path = "crates/ferrite-wire" }
ferrite-wpa = { path = "crates/ferrite-wpa" }
ferrite-xhci = { path = "crates/ferrite-xhci" }

aes = { version = "0.9.4", default-features = false }
aes-kw = { version = "0.3.1", default-features = false }
arbitrary-int = { version = "2.2.0", default-features = false }
bitbybit = "2.0.1"
cc = "1.11.1"
clap = { version = "4.6.7", features = ["derive"] }
corosensei = { version = "0.3.4", default-features = false }
crc32fast = { version = "1.5.5", default-features = false }
hmac = { version = "0.13.0", default-features = false }
humantime = "2.4.0"
jiff = "0.2.43"
libc = "0.2.191"
log = "0.4.33"
nusb = "0.2.9"
object = { version = "0.41.0", default-features = false, features = ["read_core", "elf", "write_std", "pe"] }
parking_lot = "0.13.0"
picoserve = { version = "0.20.1", default-features = false, features = ["alloc"] }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
rand_chacha = { version = "0.10.0", default-features = false }
rand_core = "0.10.1"
ratatui = { version = "0.30.2", default-features = false }
ratatui-core = "0.1.2"
rustix = { version = "1.1.6", features = ["event", "fs", "pty", "std", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = { version = "0.11.0", default-features = false }
sha2 = "0.11.1"
signal-hook = { version = "0.4.6", default-features = false }
smoltcp = { version = "0.13.1", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-dhcpv4",
    "socket-udp",
    "socket-tcp",
    "multicast",
] }
snafu = { version = "0.9.2", default-features = false, features = ["rust_1_81"] }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
toml = "1.2.1"
uefi = { version = "0.38.0", features = ["alloc"] }

assert2 = "0.4.1"
proptest = "1.12.0"
rstest = "0.28.0"

[workspace.lints.rust]
unused_lifetimes = "warn"
unused_qualifications = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
redundant_lifetimes = "warn"
# Set by the app builds: .cargo/app.toml and the UEFI target in .cargo/config.toml.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ferrite_app)"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

# Register, descriptor and address arithmetic narrows by design at fixed widths.
cast_possible_truncation = "allow"

# `#[must_use]` goes on by hand where a dropped result is a bug.
must_use_candidate = "allow"

# The typed snafu enum is the documentation.
missing_errors_doc = "allow"

# Noisy, and it fights builders that later gain a body.
missing_const_for_fn = "allow"

# Own code: opt-level 0 gives huge stack frames on the small firmware stack and
# makes the memory sweep crawl; 1 costs little compile time.
[profile.dev]
opt-level = 1

# The memory-test kernels are what membench measures and what the sweep will run; per-word overflow
# and pointer checks would be measured with them.
[profile.dev.package.ferrite-mem]
opt-level = 3
debug-assertions = false
overflow-checks = false

# Parses, checksums and copies every frame; rarely rebuilt.
[profile.dev.package.smoltcp]
opt-level = 2

# Diffs the whole screen buffer every frame.
[profile.dev.package.ratatui-core]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Full optimization + debug symbols for perf/flamegraph. lto=false keeps build
# times reasonable; strip="none" ensures symbols survive to the profiler.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"
lto = false

# Maximizes codegen-unit parallelism for the many small rebuilds cargo-mutants
# requires. Disabling incremental and debug info keeps each build lean.
[profile.mutant]
inherits = "dev"
incremental = false
debug = 0
codegen-units = 256
